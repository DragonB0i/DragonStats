name: Generate Contribution Snake

on:
  schedule:
    # Run automatically every 24 hours (at midnight UTC)
    - cron: "0 0 * * *"
  # Allow manual execution from the Actions tab
  workflow_dispatch:
  # Run on push to main branch to test/initialize
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#39ff14&color_dots=#000000,#3c0d68,#601c9a,#842cb3,#a83ccc

      - name: Push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
